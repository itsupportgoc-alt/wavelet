[package]
name = "wavelet-android"
version = "0.10.0"
edition = "2021"
publish = false

[lib]
name = "wavelet_android"
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
wavelet = { path = ".." }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# Bundles the C++ runtime the sound system needs. Without it the app cannot start on any phone.
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

[package.metadata.android]
package = "com.wavelet.music"
apk_name = "Wavelet"
# 64-bit and older 32-bit phones.
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
# App icon pictures (res/mipmap-*).
resources = "icon"

# Local signing key made for this app (keep this file to publish updates).
[package.metadata.android.signing.release]
path = "wavelet-release.keystore"
keystore_password = "wavelet-local"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Wavelet"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|uiMode"
launch_mode = "singleTop"

# Lets the app find songs in the phone's Music folder.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

# Needed to search and play real music online.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
opt-level = 3
strip = true
