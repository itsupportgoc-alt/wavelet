[package]
name = "wavelet"
version = "0.10.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wavelet"
path = "src/main.rs"

[dependencies]
rodio = { version = "0.20", features = ["symphonia-all"] }
# Reads the audio inside an MP4/M4A download (the player's own wrapper cannot handle the
# fragmented MP4 that music services send, so this is used directly).
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Desktop (Windows / macOS / Linux)
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.31"
rfd = "0.15"

# Phone (built from the android/ folder)
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[patch.crates-io]
webbrowser = { path = "patches/webbrowser" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
